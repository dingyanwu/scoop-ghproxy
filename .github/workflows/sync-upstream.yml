name: Sync upstream

# Keeps this fork up to date with the official ScoopInstaller/Scoop repository.
# Runs daily and can also be triggered manually from the Actions tab.
# If the automatic merge hits a conflict, the job fails loudly so it can be
# resolved by hand (the fork's own changes are intentionally minimal to keep
# such conflicts rare).

on:
  schedule:
    # 03:00 UTC every day.
    - cron: '0 3 * * *'
  workflow_dispatch:

# Allow the job to push the merge commit back to the fork.
permissions:
  contents: write

jobs:
  sync:
    name: Merge upstream into fork
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (default branch)
        uses: actions/checkout@v4
        with:
          # Full history is required for a real merge.
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Register "ours" merge driver
        # Files marked `merge=ours` in .gitattributes (e.g. README.md) always
        # keep this fork's version, so upstream changes never cause conflicts
        # there. `true` succeeds without touching the file, i.e. keep ours.
        run: git config merge.ours.driver true

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/ScoopInstaller/Scoop.git
          git fetch upstream master

      - name: Merge upstream/master
        run: |
          set -e
          if git merge --no-edit upstream/master; then
            echo 'Merged upstream/master successfully.'
          else
            echo '::error::Merge conflict while syncing with upstream ScoopInstaller/Scoop.'
            echo '::error::Resolve the conflict manually, then push to update the fork.'
            git merge --abort
            exit 1
          fi

      - name: Push to fork
        run: git push origin HEAD
